<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi despensa</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI', Tahoma, sans-serif; background:#f4f1ea; color:#333; padding-bottom:80px; }
  header { background:#3e5c42; color:#fff; padding:16px; position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:22px; }
  .tabs { display:flex; background:#3e5c42; position:sticky; top:80px; z-index:9; overflow-x:auto; }
  .tab { flex:1; padding:12px 4px; text-align:center; color:#c8d6ca; font-size:12px; font-weight:bold; cursor:pointer; border-bottom:4px solid transparent; min-width:70px; }
  .tab.activa { color:#fff; border-bottom-color:#f2c94c; }
  .panel { padding:16px; display:none; }
  .panel.activa { display:block; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:12px; background:#fff; margin-bottom:8px; border-radius:12px; }
  .btn-abrir { background:#4caf50; color:#fff; border:none; padding:8px; border-radius:5px; font-weight:bold; }
  .btn-gastar { background:#ff9800; color:#fff; border:none; padding:8px; border-radius:5px; font-weight:bold; }
  .btn-mover { background:#03a9f4; color:#fff; border:none; padding:8px; border-radius:5px; font-weight:bold; }
  .fab { position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:#f2c94c; color:#3e5c42; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.3); cursor:pointer; z-index:20; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; z-index:30; }
  .modal.abierto { display:flex; }
  .modal-caja { background:#fff; width:100%; padding:20px; border-radius:20px 20px 0 0; max-height:90vh; overflow-y:auto; }
  .campo { margin-bottom:12px; }
  .campo label { font-size:14px; font-weight:bold; color:#555; }
  .campo input, .campo select { width:100%; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:8px; margin-top:4px; }
  .fila { display:flex; gap:6px; margin-top:4px; }
  .fila input { flex:1; }
  .btn-icono { background:#eee; font-size:18px; border:1px solid #ccc; border-radius:8px; padding:8px; }
  .aviso { padding:10px; border-radius:8px; margin-bottom:8px; font-size:14px; }
  .aviso.rojo { background:#ffebee; border-left:4px solid #d32f2f; }
  .aviso.ambar { background:#fff8e1; border-left:4px solid #f57c00; }
  .buscador { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:12px; font-size:15px; }
  .receta { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; border-left:4px solid #3e5c42; }
  .receta h3 { margin:0 0 6px; font-size:16px; color:#2c3e2e; }
  .meta { font-size:12px; color:#666; margin-bottom:6px; font-weight:bold; }
  .ing { font-size:13px; margin:6px 0; }
  .tiene { color:#2e7d32; } .falta { color:#c67a00; }
  .pasos { font-size:14px; margin-top:8px; padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1>👨‍🍳 Mi Despensa</h1>
  <div style="margin-top:8px; display:flex; gap:6px;">
    <button id="btn-backup" style="flex:1; background:#f2c94c; color:#3e5c42; font-size:12px; padding:6px; border-radius:8px; font-weight:bold;">💾 Copia</button>
    <button id="btn-restore" style="flex:1; background:#8fa894; color:#fff; font-size:12px; padding:6px; border-radius:8px; font-weight:bold;">📥 Restaurar</button>
  </div>
</header>
<div id="avisos-globales" style="padding: 12px 12px 0 12px;"></div>
<div class="tabs">
  <div class="tab activa" data-tab="nevera">🧊 Nevera</div>
  <div class="tab" data-tab="congelador">❄️ Congelador</div>
  <div class="tab" data-tab="despensa">🥫 Despensa</div>
  <div class="tab" data-tab="recetas">🍳 Recetas</div>
  <div class="tab" data-tab="trucos">💡 Trucos</div>
</div>
<div class="panel activa" id="panel-nevera"></div>
<div class="panel" id="panel-congelador"></div>
<div class="panel" id="panel-despensa"></div>
<div class="panel" id="panel-recetas"></div>
<div class="panel" id="panel-trucos"></div>
<div class="fab" id="fab-add">+</div>
<div class="modal" id="modal">
  <div class="modal-caja">
    <h3>Añadir producto</h3>
    <div class="campo" style="position:relative;">
      <label>Producto</label>
      <div class="fila">
        <input id="in-nombre" placeholder="Escribe..." autocomplete="off">
        <button class="btn-icono" id="btn-micro-nombre">🎤</button>
        <button class="btn-icono" id="btn-camara-nombre">📷</button>
      </div>
      <input type="file" id="in-foto-nombre" accept="image/*" capture="environment" style="display:none">
      <div id="sugerencias" style="background:#fff; border:1px solid #ccc; position:absolute; width:100%; z-index:10; display:none; max-height:150px; overflow-y:auto;"></div>
      <div id="ocr-estado" style="font-size:12px; color:#3e5c42; margin-top:4px; display:none; font-weight:bold;"></div>
    </div>
    <div class="campo">
      <label>Caduca el (opcional)</label>
      <div class="fila">
        <input id="in-caduca" type="date" style="flex:1;">
        <button class="btn-icono" id="btn-micro-fecha">🎤</button>
        <button class="btn-icono" id="btn-camara-fecha">📷</button>
      </div>
      <input type="file" id="in-foto-fecha" accept="image/*" capture="environment" style="display:none">
    </div>
    <div class="campo">
      <label>Ubicación</label>
      <select id="in-ubi"><option value="nevera">Nevera</option><option value="congelador">Congelador</option><option value="despensa">Despensa</option></select>
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn-abrir" id="btn-cancelar" style="flex:1; background:#ccc; color:#333;">Cancelar</button>
      <button class="btn-abrir" id="btn-guardar" style="flex:2; background:#3e5c42;">Guardar Producto</button>
    </div>
  </div>
</div>
<script>
window.onerror = function(msg, url, line, col, error) {
   alert("¡ERROR ENCONTRADO!\nMensaje: " + msg + "\nArchivo: " + url + "\nLínea: " + line);
   return false;
};
</script>
<script src="trucos.js"></script>
<script src="recetas.js"></script>
<script src="apps.js"></script>
</body>
</html>
